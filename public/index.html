<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meadow Multiplayer RPG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182d24;color:#fff;font-family:system-ui,Segoe UI,sans-serif}canvas{width:100vw;height:100vh;display:block;image-rendering:pixelated;touch-action:none}.hud{position:fixed;top:16px;left:16px;width:260px;background:#10251eea;border:1px solid #7bb48b66;border-radius:12px;padding:13px 16px;box-shadow:0 6px 25px #0006}.title{font-size:17px;font-weight:800}.meta{font-size:12px;color:#d0e4d0;margin:6px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#efb45f;margin-right:6px}.dot.online{background:#74d991}.stats{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin:8px 0 4px}.bar{height:11px;border-radius:6px;overflow:hidden;background:#0008;border:1px solid #ffffff33}.fill{height:100%;width:100%;background:#eb6c72;transition:width .18s}.expfill{background:#76b9ff}.muted{color:#b9cbbb;font-size:12px}.nameRow{display:flex;gap:7px;margin-top:10px}.nameRow input{background:#203d31;border:1px solid #8eb29977;border-radius:5px;color:white;min-width:0;flex:1;padding:7px 8px}.nameRow button{background:#387c58;border:0;border-radius:5px;color:white;font-weight:700;padding:7px 10px;cursor:pointer}.hint{position:fixed;left:16px;bottom:16px;background:#10251edc;padding:10px 13px;border-radius:9px;font-size:13px;color:#e1efdf;pointer-events:none}.notices{position:fixed;top:18px;right:18px;display:grid;gap:6px;pointer-events:none}.notice{padding:8px 12px;border-radius:8px;background:#10251ee9;color:#e4f4e4;border:1px solid #7bb48b66;font-size:13px}@media(max-width:600px){.hud{left:8px;top:8px;width:225px;padding:9px 11px}.hint{left:8px;bottom:8px;font-size:11px}}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="title">🌿 Meadow Multiplayer</div><div class="meta"><span id="dot" class="dot"></span><span id="status">Connecting…</span> · <span id="count">0</span> online</div><div class="stats"><span id="level">Level 1</span><span id="hptext">5 / 5 HP</span></div><div class="bar"><div class="fill" id="hpbar"></div></div><div class="stats"><span>Experience</span><span id="exptext">0 / 17</span></div><div class="bar"><div class="fill expfill" id="expbar"></div></div><div class="nameRow"><input id="name" maxlength="18" placeholder="Your name" aria-label="Player name"><button id="rename">Rename</button></div><div class="muted" style="margin-top:7px">Progress auto-saved in this browser</div></div><div id="notices" class="notices"></div><div class="hint">Move: WASD / Arrows · Jump: Space · Sword: F · Monsters: Rat & Bat</div><script src="game.js"></script></body></html>
